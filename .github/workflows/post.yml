name: Публикация в Instagram

on:
  schedule:
    # Время UTC. Астана = UTC+5  →  08:47, 13:47 и 18:47 по Астане
    - cron: "47 3,8,13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-reel-post
  cancel-in-progress: false

jobs:
  pick:
    if: vars.BOT_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    outputs:
      has_reel: ${{ steps.pick.outputs.has_reel == 'true' || steps.build.outputs.has_reel == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Взять готовый ролик из очереди
        id: pick
        run: python -m bot.main pick

      # Запасной путь: очередь пуста — собираем ролик прямо сейчас
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.need_build == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Установка видео-инструментов
        if: steps.pick.outputs.need_build == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm ci --prefix video --no-audit --no-fund
          cd video && npx remotion browser ensure

      - name: Собрать ролик сейчас
        id: build
        if: steps.pick.outputs.need_build == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python -m bot.main build

      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.has_reel == 'true' || steps.build.outputs.has_reel == 'true'
        with:
          name: reel
          path: out/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: steps.pick.outputs.has_reel == 'true' || steps.build.outputs.has_reel == 'true'
        with:
          path: site

  deploy:
    needs: pick
    if: needs.pick.outputs.has_reel == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: [pick, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: reel
          path: out

      - name: Опубликовать в Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: python -m bot.main publish

      - name: Запомнить опубликованное
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/posted.json
          git commit -m "posted: $(date -u +%F_%H:%M)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
